<!doctype html>
<html lang="zh-Hant">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width,initial-scale=1">
 <meta name="robots" content="noindex,nofollow">
 <title>手機預覽｜OMNIPLAY</title>
 <link rel="icon" href="./op-mark.svg">
 <style>
 *{box-sizing:border-box}body{margin:0;background:#eef2f8;color:#253751;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
 #previewCapture{width:fit-content;max-width:100%;margin:0 auto;padding:20px 14px 28px}
 header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}h1{margin:0;font-size:16px}#previewDimensions{font:600 12px/1.4 monospace;color:#617791}
 nav{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:12px}
 button,select,a{font:inherit}button,select,.open{min-height:34px;padding:7px 10px;border:1px solid #cad7e8;border-radius:8px;background:#fff;color:#365473;cursor:pointer;text-decoration:none;font-size:12px;font-weight:600}
 :is(button,select,a):focus-visible{outline:3px solid #85b0f0;outline-offset:2px}.open{display:inline-flex;align-items:center}
 #previewPhoneSpace{margin:0 auto;position:relative}#previewPhone{position:absolute;left:0;top:0;transform-origin:top left;border:6px solid #26364e;border-radius:22px;overflow:hidden;box-shadow:0 8px 24px #263b5726;background:#fff}
 iframe{display:block;width:100%;height:100%;border:0;background:#fff}footer{max-width:420px;margin:12px auto 0;font-size:11px;line-height:1.6;color:#61748f}footer p{margin:4px 0}
 @media(max-width:460px){#previewCapture{padding:14px 10px 20px}}
 </style>
</head>
<body>
 <main id="previewCapture">
  <header><h1 data-en="Mobile Live Preview">手機版即時預覽</h1><span id="previewDimensions"></span></header>
  <nav aria-label="Preview controls">
   <select id="previewSize" aria-label="畫面尺寸"><option value="390x844">390 × 844</option><option value="430x932">430 × 932</option></select>
   <button id="previewReload" type="button" data-en="Reload">重新載入</button>
   <a id="previewOpen" class="open" data-en="Open Site ↗">開啟網站 ↗</a>
  </nav>
  <div id="previewPhoneSpace"><div id="previewPhone"><iframe id="mobilePreviewFrame" title="OMNIPLAY 手機版即時預覽"></iframe></div></div>
  <footer><p id="previewStatus" role="status"></p><p data-en="This is the live site in a mobile-sized viewport. Actions use real data. Safari device testing is separate.">此為真實網站的手機尺寸預覽，操作會使用實際資料。Safari 實機測試另計。</p></footer>
 </main>
 <script type="module" src="./mobile-preview.js?v=20261027-mobile-preview-1"></script>
</body>
</html>
