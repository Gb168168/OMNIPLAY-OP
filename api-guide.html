<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OMNIPLAY｜API 串接指南</title><style>
:root{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#23374f;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}.top{background:white;border-bottom:1px solid #e4eaf2;padding:18px max(24px,calc((100vw - 980px)/2));display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:800;letter-spacing:.06em;color:#1c416d}.lang{border:1px solid #cbd7e6;border-radius:8px;background:white;padding:9px 13px;cursor:pointer}main{max-width:980px;margin:35px auto;padding:0 20px}h1{font-size:29px;margin:0 0 8px}p.sub{color:#718197;margin:0 0 25px;font-size:14px}.search{width:100%;border:1px solid #d6e0ec;background:#fff;border-radius:12px;padding:15px 18px;font:inherit;outline-color:#4a85c9}.chips{display:flex;gap:9px;flex-wrap:wrap;margin:20px 0 25px}.chip{border:1px solid #d7e1ed;background:white;border-radius:24px;padding:9px 16px;color:#526b87;cursor:pointer;font:inherit;font-size:13px}.chip.active{background:#254e7c;color:#fff;border-color:#254e7c}.count{font-size:13px;color:#8491a2;margin:0 0 12px}.faq{border:1px solid #dfe6f0;background:white;border-radius:12px;margin:0 0 11px;overflow:hidden}.faq summary{list-style:none;display:flex;justify-content:space-between;align-items:center;cursor:pointer;padding:19px 20px;gap:15px;font-weight:650}.faq summary::-webkit-details-marker{display:none}.faq summary:after{content:'+';font-size:21px;color:#6d85a1}.faq[open] summary:after{content:'−'}.answer{border-top:1px solid #edf0f5;padding:19px 22px;line-height:1.9;font-size:14px;color:#3f526a}.answer ol{padding-left:22px;margin:8px 0}.answer code{background:#f1f5fa;border-radius:4px;padding:2px 5px}.tag{display:inline-block;color:#416e9f;background:#edf4fc;font-size:11px;font-weight:500;padding:3px 8px;border-radius:5px;margin-top:7px}.empty{text-align:center;color:#8392a4;padding:45px}.foot{text-align:center;font-size:12px;color:#8795a5;margin:38px 0}@media(max-width:600px){main{margin:24px auto}h1{font-size:24px}.top{padding:15px 20px}.faq summary{padding:16px}}
</style></head><body><header class="top"><span class="brand">OMNIPLAY <span style="font-weight:400;color:#8b9aae">/ API</span></span><button class="lang" id="lang">EN</button></header><main><h1 id="title"></h1><p class="sub" id="subtitle"></p><input class="search" id="search" placeholder="搜尋 Action、錯誤碼或問題…"><div class="chips" id="chips"></div><p class="count" id="count"></p><section id="items"></section><p class="foot" id="foot"></p></main><script>
const faq=[
{cat:'single',action:'Action 2',zhQ:'完成單一錢包串接後，如何驗證 Action 2（取消投注）？',enQ:'How do we verify Action 2 (Rollback) after Single Wallet integration?',zhA:'<p>請配合進行 1–2 次測試：</p><ol><li>先進行測試投注，觸發 <code>Action 1</code>。</li><li>針對該筆請求模擬逾時（不回應），或回傳非預期狀態碼（例如 <code>6001</code>）。</li><li>由雙方確認是否觸發 <code>Action 2</code>（取消投注）。</li><li>核對 Action 2 回傳 <code>status: "0000"</code>，並確認該筆交易已正確取消。</li></ol><p>如未觸發或返回非 0000，請提供測試時間及相關請求紀錄協助排查。</p>',enA:'<p>Please perform 1–2 test attempts:</p><ol><li>Place a test bet to trigger <code>Action 1</code>.</li><li>Simulate a timeout (no response) or return an unexpected status code such as <code>6001</code>.</li><li>Verify together whether <code>Action 2</code> (Rollback) is triggered.</li><li>Check for <code>status: "0000"</code> and verify the transaction was rolled back correctly.</li></ol><p>If rollback is not triggered or returns another status, please share the test time and request logs.</p>'},
{cat:'single',action:'Action 1',zhQ:'Action 1 回傳 6001，就代表取消投注成功嗎？',enQ:'Does a 6001 response from Action 1 mean rollback succeeded?',zhA:'<p>不是。<code>6001</code> 在此僅作為模擬異常回應的範例。仍須另外確認 <code>Action 2</code> 是否正確觸發、回傳結果，以及交易是否取消。</p>',enA:'<p>No. <code>6001</code> is only an example of an unexpected response for testing. You must separately verify Action 2, its response, and the final transaction state.</p>'},
{cat:'single',action:'Action 2',zhQ:'測試 Action 2 時，客戶需要提供哪些資料？',enQ:'What information should be provided for an Action 2 test?',zhA:'<p>請提供測試玩家帳號、測試時間（含時區）、相關交易識別資料，以及 Action 1 / Action 2 的請求與回應紀錄，以便雙方核對。</p>',enA:'<p>Please provide the test player account, test time and time zone, transaction identifiers, and Action 1 / Action 2 request and response logs.</p>'},
{cat:'process',action:'API',zhQ:'API 串接完成後，下一步是什麼？',enQ:'What happens after API integration is complete?',zhA:'<p>請通知 OMNIPLAY 團隊已完成串接，並提供測試環境與可用的測試帳號。我們會協助安排相關 API 功能與異常情境的驗收測試。</p>',enA:'<p>Notify the OMNIPLAY team that integration is complete and provide the test environment and an available test account. We will coordinate API acceptance testing, including error scenarios.</p>'},
{cat:'errors',action:'Status',zhQ:'收到非預期錯誤碼，應如何協助排查？',enQ:'How should we troubleshoot an unexpected status code?',zhA:'<p>請提供對應 Action、完整錯誤碼、測試時間（含時區）與請求／回應紀錄。請勿在公開訊息中傳送密碼、金鑰或其他敏感資訊。</p>',enA:'<p>Share the Action number, status code, test time and time zone, and request/response logs. Do not share passwords, API keys, or other sensitive data in public messages.</p>'}
];
const names={all:['全部','All'],process:['串接流程','Integration'],single:['單一錢包','Single Wallet'],transfer:['轉帳錢包','Transfer Wallet'],errors:['錯誤碼','Status Codes']};let en=localStorage.getItem('omniplay-guide-lang')==='en',cat='all';const el=id=>document.getElementById(id);function render(){document.documentElement.lang=en?'en':'zh-Hant';el('title').textContent=en?'API Integration Guide & FAQ':'API 串接指南與常見問題';el('subtitle').textContent=en?'Simple answers to common integration and testing questions.':'快速查找串接流程、測試方式與常見問題。';el('search').placeholder=en?'Search Actions, status codes, or questions…':'搜尋 Action、錯誤碼或問題…';el('lang').textContent=en?'繁中':'EN';el('chips').innerHTML=Object.keys(names).map(k=>'<button class="chip '+(cat===k?'active':'')+'" data-cat="'+k+'">'+names[k][en?1:0]+'</button>').join('');const q=el('search').value.trim().toLowerCase();const rows=faq.filter(f=>(cat==='all'||f.cat===cat)&&[f.zhQ,f.enQ,f.zhA.replace(/<[^>]*>/g,' '),f.enA.replace(/<[^>]*>/g,' '),f.action].join(' ').toLowerCase().includes(q));el('count').textContent=en?rows.length+' articles':rows.length+' 則問答';el('items').innerHTML=rows.length?rows.map(f=>'<details class="faq"><summary><span>'+(en?f.enQ:f.zhQ)+'<br><span class="tag">'+names[f.cat][en?1:0]+' · '+f.action+'</span></span></summary><div class="answer">'+(en?f.enA:f.zhA)+'</div></details>').join(''):'<p class="empty">'+(en?'No matching questions yet.':'目前沒有符合的問答。')+'</p>';el('foot').textContent=en?'OMNIPLAY · Integration reference':'OMNIPLAY · API 串接參考指南';}el('chips').onclick=e=>{const b=e.target.closest('[data-cat]');if(b){cat=b.dataset.cat;render()}};el('lang').onclick=()=>{en=!en;localStorage.setItem('omniplay-guide-lang',en?'en':'zh');render()};el('search').oninput=render;render();
</script></body></html>
