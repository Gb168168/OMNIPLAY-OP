name: Sync customer views
on:
  schedule:
    - cron: '3-59/10 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: sync-customer-views
  cancel-in-progress: false
jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install sync dependencies
        run: |
          npm ci --prefix projection-worker --omit=dev --ignore-scripts --no-audit --no-fund
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.OMNIPLAY_SYNC_PROVIDER }}
          service_account: ${{ vars.OMNIPLAY_SYNC_ACCOUNT }}
      - name: Refresh customer views
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || [ "$(date -u +%H)" = 03 -a "$(date -u +%M)" -lt 10 ]; then
            node projection-worker/run.mjs --full
          else
            node projection-worker/run.mjs
          fi
