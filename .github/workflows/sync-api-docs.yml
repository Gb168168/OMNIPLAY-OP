name: Sync API reading copy
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/sync-api-docs.py']
permissions:
  contents: write
  pages: write
concurrency:
  group: api-docs-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test synchronization safeguards
        run: python -m unittest discover -s tests -p test_api_document_sync.py
      - name: Fetch and validate public API documentation
        run: python scripts/sync-api-docs.py
      - name: Commit snapshot and request Pages rebuild
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api-docs/snapshot.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Sync public API documentation reading copy'
          git pull --rebase origin main
          git push origin HEAD:main
          gh api --method POST "repos/$REPO/pages/builds"
