<!doctype html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<style>html:not(.auth-ready) #app{visibility:hidden!important}#startupStatus{position:fixed;inset:0;display:grid;place-content:center;gap:12px;padding:24px;text-align:center;background:#f3f6fc;color:#172033;z-index:99999}html.auth-ready #startupStatus,html.needs-login #startupStatus{display:none}</style>
<script>
try{localStorage.removeItem('omniplay-theme');const session=JSON.parse(localStorage.getItem('omniplay-login-session-v1')||sessionStorage.getItem('omniplay-login-session-v1')||'null');if(session&&!session.superAdmin)document.documentElement.classList.add('access-loading')}catch{}
</script>
<title>OMNIPLAY ASSETS</title>
<link rel="icon" type="image/svg+xml" sizes="any" href="./op-mark.svg?v=20261021-op-1"/>
<link rel="alternate icon" type="image/png" sizes="32x32" href="./op-mark-32.png?v=20261021-op-1"/>
<link rel="apple-touch-icon" sizes="180x180" href="./op-mark-180.png?v=20261021-op-1"/>

<link rel="stylesheet" href="./styles.css?v=20261026-category-shortcuts-1"/>
<script src="./interface-language.js?v=20261026-platform-monitor-1"></script>
<style>
.platform-visibility-row{position:relative;display:flex!important;align-items:center;justify-content:space-between;gap:20px;padding:13px 14px;margin:12px 0;border:1px solid #d5e1ef;border-radius:10px;background:#f7faff;cursor:pointer}.platform-visibility-row>span:first-child{display:grid;gap:5px}.platform-visibility-row strong{font-size:14px}.platform-visibility-row small{font-size:12px;color:#64748b;line-height:1.5}.platform-visibility-row input[type=checkbox]{position:absolute;right:14px;width:44px!important;height:26px;margin:0;opacity:0;cursor:pointer}.platform-visibility-track{width:44px;height:26px;flex-shrink:0;position:relative;border-radius:99px;background:#b7c4d5;transition:background .15s}.platform-visibility-track:after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;background:#fff;border-radius:50%;box-shadow:0 1px 4px #22395130;transition:transform .15s}.platform-visibility-row input:checked+.platform-visibility-track{background:#3977e8}.platform-visibility-row input:checked+.platform-visibility-track:after{transform:translateX(18px)}.platform-visibility-row input:focus-visible+.platform-visibility-track{outline:2px solid #2563eb;outline-offset:3px}.platform-visibility-row input:disabled+.platform-visibility-track{opacity:.45}.platform-visibility-row input{z-index:1}.workspace-item-menu .platform-visibility-row{margin:8px 0}.platform-custom-category{position:relative}.platform-custom-category summary{list-style:none;padding:10px 14px;border:1px solid #cbd9ed;border-radius:9px;background:#f4f8ff;color:#24558e;font-size:13px;cursor:pointer}.platform-custom-category>div{display:grid;gap:4px;position:absolute;top:calc(100% + 5px);left:0;min-width:180px;padding:7px;border:1px solid #cbd9ed;background:white;border-radius:10px;box-shadow:0 10px 26px #20365120;z-index:100}.platform-custom-category button{text-align:left;border:0;background:transparent;padding:9px;border-radius:6px;color:#24558e;cursor:pointer}.platform-custom-category button.active{background:#e7f0ff}
</style>
<script defer src="./mobile-navigation.js?v=20261026-add-top-1"></script>
</head>
<body>
<div id="startupStatus" role="status"><p id="startupMessage">正在載入登入畫面…</p></div>
<div id="app">
<aside class="sidebar">
<div class="brand">OMNIPLAY ASSETS</div>
<button id="addCategoryBtn" class="primary">＋ 新增</button>
<button id="customerBtn" class="side-action">🏢 所有平台列表</button>
<div id="categoryList" class="category-list">
</div>
</aside>
<main class="main">
<header class="topbar">
<div>
<div id="breadcrumb" class="breadcrumb">工作區</div>
<h1 id="pageTitle">歡迎使用 OMNIPLAY</h1>
</div>
<div class="actions">
<span id="cloudStatus" class="status">連接雲端中…</span>
<button id="addPageBtn" class="primary hidden" hidden disabled>＋ 新增頁面</button>
</div>
</header>
<section id="emptyState" class="empty-state">
<div>
<h2>正在載入工作區…</h2>
<p>正在取得雲端分類與頁面，請稍候。</p>
</div>
</section>
<section id="workspace" class="workspace hidden">
</section>
</main>
</div>
<dialog id="categoryDialog">
<form method="dialog" id="categoryForm" class="dialog-form">
<div class="modal-head">
<div>
<div class="eyebrow">WORKSPACE</div>
<h3>新增分類</h3>
</div>
<button type="button" class="icon-close" data-close="categoryDialog">×</button>
</div>
<label>分類名稱<input id="categoryName" required maxlength="60" placeholder="例如：VIP客戶、財務、產品資料"/>
</label>
<div class="dialog-actions">
<button type="button" class="secondary" data-close="categoryDialog">取消</button>
<button class="primary" value="default">建立分類</button>
</div>
</form>
</dialog>
<dialog id="pageDialog">
<form method="dialog" id="pageForm" class="dialog-form">
<div class="modal-head">
<div>
<div class="eyebrow">PAGE</div>
<h3>新增分類／頁面</h3>
</div>
<button type="button" class="icon-close" data-close="pageDialog">×</button>
</div>
<label>分類<select id="newItemCategory" required></select></label>
<label id="newItemCategoryField" class="hidden">新分類名稱<input id="newItemCategoryName" maxlength="60" placeholder="輸入要新增的分類"/></label>
<label id="newItemPageChoice" class="hidden"><span><input id="newItemCreatePage" type="checkbox" checked style="width:auto"/> 同時新增頁面</span></label>
<div id="newItemPageFields">
<label>頁面名稱<input id="pageName" required maxlength="80" placeholder="輸入頁面名稱"/>
</label>
<label>頁面類型<select id="pageType">
<option value="sheet">📊 試算表</option>
<option value="files">📄 檔案 / PDF</option>
<option value="photos">🖼️ 照片</option>
<option value="videos">🎬 影片</option>
</select>
</label>
</div>
<label class="platform-visibility-row"><span><strong>平台可見</strong><small id="newItemVisibilityHint">關閉時僅管理端可見；開啟後所有平台都可查看。</small></span><input id="newItemPlatformVisible" type="checkbox" role="switch" aria-label="平台可見"><span class="platform-visibility-track" aria-hidden="true"></span></label>
<div class="dialog-actions">
<button type="button" class="secondary" data-close="pageDialog">取消</button>
<button id="newItemSubmit" class="primary" value="default">建立</button>
</div>
</form>
</dialog>
<dialog id="groupDialog" class="modal-md">
<form method="dialog" id="groupForm" class="dialog-form">
<div class="modal-head">
<div>
<div class="eyebrow">CUSTOMER GROUP</div>
<h3>新增客戶群組</h3>
<p>用群組整理不同類型的客戶。</p>
</div>
<button type="button" class="icon-close" data-close="groupDialog">×</button>
</div>
<label>群組名稱<input id="groupName" required maxlength="50" placeholder="例如：VIP客戶、代理商、內部人員"/>
</label>
<div class="dialog-actions">
<button type="button" class="secondary" data-close="groupDialog">取消</button>
<button class="primary" value="default">新增群組</button>
</div>
</form>
</dialog>
<dialog id="groupManagerDialog" class="modal-md">
<div class="dialog-form">
<div class="modal-head"><div><div class="eyebrow">CUSTOMER GROUPS</div><h3>群組分類管理</h3><p>新增群組，或刪除目前未被平台使用的群組。</p></div><button type="button" class="icon-close" data-close="groupManagerDialog">×</button></div>
<div id="groupManagerList" class="group-manager-list"></div>
<div class="dialog-actions"><button type="button" class="secondary" data-close="groupManagerDialog">關閉</button><button type="button" class="primary" id="addManagedGroup">＋ 新增群組分類</button></div>
</div>
</dialog>
<dialog id="customerDialog" class="modal-xl">
<form method="dialog" id="customerForm" class="dialog-form">
<div class="modal-head">
<div>
<div class="eyebrow">CUSTOMER ACCOUNT</div>
<h3 id="customerDialogTitle">建立平台</h3>
</div>
<button type="button" class="icon-close" data-close="customerDialog">×</button>
</div>
<div class="customer-form-row customer-form-row-first">
<label>客戶名稱<input id="customerName" required maxlength="80" placeholder="例如：ABC 公司"/></label>
<label>客戶域名<input id="customerDomain" maxlength="160" placeholder="例如：abc.com"/></label>
<label>客戶群組<div class="select-add"><select id="customerType"></select><button type="button" class="add-option" data-target="customerType" aria-label="新增客戶群組選項">＋</button></div></label>
</div>
<div class="customer-form-row customer-form-row-second">
<label>對接進度<div class="select-add"><select id="customerProgress"></select><button type="button" class="add-option" data-target="customerProgress" aria-label="新增對接進度選項">＋</button></div></label>
<label>平台正式上線日期<input id="customerLaunchDate" type="date" title="點擊選擇正式上線日期"/></label>
<label>備註說明<textarea id="customerNotes" rows="3" maxlength="1000" placeholder="輸入客戶備註"></textarea></label>
<label>所屬群組<div class="select-add"><select id="customerGroup"></select><button type="button" class="add-option" data-target="customerGroup" aria-label="新增所屬群組選項">＋</button></div></label>
</div>
<div class="dialog-actions">
<button type="button" class="secondary" data-close="customerDialog">取消</button>
<button class="primary" id="customerSubmitBtn" value="default">建立平台</button>
</div>
</form>
</dialog>
<input id="hiddenUpload" type="file" hidden multiple/>

<script src="./sheet-freeze-cleanup.js?v=20260826-1">
</script>
<script type="module">try{await import('./login-auth.js?v=20261026-api-entry-editor-1');let sheetLibraryPromise;window.ensureSpreadsheetLibraries=()=>{if(!sheetLibraryPromise)sheetLibraryPromise=(async()=>{const sheetStyle=document.createElement('link');sheetStyle.rel='stylesheet';sheetStyle.href='https://unpkg.com/@univerjs/preset-sheets-core@0.10.10/lib/index.css';document.head.append(sheetStyle);const noteStyle=document.createElement('link');noteStyle.rel='stylesheet';noteStyle.href='https://unpkg.com/@univerjs/preset-sheets-note@0.10.10/lib/index.css';document.head.append(noteStyle);const loadLibrary=src=>new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(new Error('試算表程式下載逾時')),15000);const script=document.createElement('script');script.src=src;script.onload=()=>{clearTimeout(timer);resolve()};script.onerror=()=>{clearTimeout(timer);reject(new Error('無法載入試算表程式：'+src))};document.head.append(script)});const sheetLibraries=["https://unpkg.com/react@18.3.1/umd/react.production.min.js","https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js","https://unpkg.com/rxjs@7.8.2/dist/bundles/rxjs.umd.min.js","https://unpkg.com/echarts@5.6.0/dist/echarts.min.js","https://unpkg.com/@univerjs/presets@0.10.10/lib/umd/index.js","https://unpkg.com/@univerjs/preset-sheets-core@0.10.10/lib/umd/index.js","https://unpkg.com/@univerjs/preset-sheets-core@0.10.10/lib/umd/locales/zh-TW.js"];await Promise.all([loadLibrary(sheetLibraries[0]),loadLibrary(sheetLibraries[2]),loadLibrary(sheetLibraries[3])]);await loadLibrary(sheetLibraries[1]);for(const src of sheetLibraries.slice(4))await loadLibrary(src);await loadLibrary('https://unpkg.com/@univerjs/preset-sheets-core@0.10.10/lib/umd/locales/en-US.js');await loadLibrary('https://unpkg.com/@univerjs/preset-sheets-note@0.10.10/lib/umd/index.js');await loadLibrary('https://unpkg.com/@univerjs/preset-sheets-note@0.10.10/lib/umd/locales/zh-TW.js');await loadLibrary('https://unpkg.com/@univerjs/preset-sheets-note@0.10.1 <script src="./sheet-shift-enter.js?v=20260825-3">
</script>
<script src="./sheet-ui-cleanup.js?v=20260829-2">
</script>
<script src="./customer-guard.js?v=20261026-api-entry-editor-1">
</script>
<script type="module" src="./page-title.js?v=20261021-page-title-1"></script>
</body>
</html>
