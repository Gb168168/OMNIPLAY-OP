<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>OMNIPLAY OP Workspace</title><script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script><script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script><script src="https://unpkg.com/rxjs/dist/bundles/rxjs.umd.min.js"></script><script src="https://unpkg.com/echarts@5.6.0/dist/echarts.min.js"></script><script src="https://unpkg.com/@univerjs/presets/lib/umd/index.js"></script><script src="https://unpkg.com/@univerjs/preset-sheets-core/lib/umd/index.js"></script><script src="https://unpkg.com/@univerjs/preset-sheets-core/lib/umd/locales/zh-TW.js"></script><link rel="stylesheet" href="https://unpkg.com/@univerjs/preset-sheets-core/lib/index.css"/><link rel="stylesheet" href="./styles.css"/></head><body><div id="app"><aside class="sidebar"><div class="brand">🔥 OMNIPLAY OP</div><button id="addCategoryBtn" class="primary">＋ 新增分類</button><button id="customerBtn" class="side-action">👥 客戶列表 / 權限</button><div id="categoryList" class="category-list"></div></aside><main class="main"><header class="topbar"><div><div id="breadcrumb" class="breadcrumb">工作區</div><h1 id="pageTitle">歡迎使用 OMNIPLAY</h1></div><div class="actions"><span id="cloudStatus" class="status">連接雲端中…</span><button id="addPageBtn" class="primary" disabled>＋ 新增頁面</button></div></header><section id="emptyState" class="empty-state"><div><h2>建立你的第一個分類</h2><p>分類中可新增試算表、檔案、照片或影片頁面。</p></div></section><section id="workspace" class="workspace hidden"></section></main></div><dialog id="categoryDialog"><form method="dialog" id="categoryForm" class="dialog-form"><h3>新增分類</h3><label>分類名稱<input id="categoryName" required maxlength="60"/></label><div class="dialog-actions"><button value="cancel">取消</button><button class="primary" value="default">建立</button></div></form></dialog><dialog id="pageDialog"><form method="dialog" id="pageForm" class="dialog-form"><h3>新增頁面</h3><label>頁面名稱<input id="pageName" required maxlength="80"/></label><label>頁面類型<select id="pageType"><option value="sheet">📊 試算表</option><option value="files">📄 檔案 / PDF</option><option value="photos">🖼️ 照片</option><option value="videos">🎬 影片</option></select></label><div class="dialog-actions"><button value="cancel">取消</button><button class="primary" value="default">建立</button></div></form></dialog><input id="hiddenUpload" type="file" hidden multiple/><script type="module" src="./app.js"></script></body></html>
